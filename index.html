    .marker-pin-matching {

      position: absolute; transform: rotate(-45deg);
      left: 50%; top: 50%; margin: -18px 0 0 -13px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.6);
      transition: all 0.2s ease-in-out; cursor: pointer;
    }
    .marker-pin-matching:hover {
      transform: rotate(-45deg) scale(1.25);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.9);

    }

    }
    .marker-pin-nonmatching {
      width: 12px; height: 12px; border-radius: 50%;
      background: #475569; opacity: 0.4; border: 2px solid #1e293b;
      position: absolute; left: 50%; top: 50%; margin: -6px 0 0 -6px;
      transition: all 0.2s ease;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.96) !important;

  <!-- React Standalone App Code -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const DEFAULT_FILTERS = {
      minPopulation: 5000,
      maxPopulation: 3000000,
      maxHousePrice: 2500000,
      minIncome: 50000,
      minVisibleMinority: 0,
      maxCostcoTime: 120,
      maxMetroTime: 180
    };

    function App() {
      const [cities, setCities] = useState(window.ONTARIO_CITIES_DATA || []);
      const [filters, setFilters] = useState(DEFAULT_FILTERS);
      const [selectedCity, setSelectedCity] = useState(null);
      const [detailModalCity, setDetailModalCity] = useState(null);
      const [mobileTab, setMobileTab] = useState('filters');
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('population-desc');

      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef({});

      // Population Min & Max and Income filter logic
      const matchingCities = useMemo(() => {
        return cities.filter(city => {
          const minP = Number(filters.minPopulation) || 0;
          const maxP = Number(filters.maxPopulation) || Infinity;
          const minInc = Number(filters.minIncome) || 0;

          const matchPop = city.population >= minP && city.population <= maxP;
          const matchPrice = city.avg4BedHousePrice <= filters.maxHousePrice;
          const matchIncome = city.medianHouseholdIncome >= minInc;
          const matchMinority = city.visibleMinorityPercentage >= filters.minVisibleMinority;
          const matchCostco = city.travelTimeToCostcoMinutes <= filters.maxCostcoTime;
          const matchMetro = city.travelTimeToCityOver500kMinutes <= filters.maxMetroTime;

          return matchPop && matchPrice && matchIncome && matchMinority && matchCostco && matchMetro;
        });
      }, [cities, filters]);

      const matchingCityIds = useMemo(() => {
        return new Set(matchingCities.map(c => c.id));
      }, [matchingCities]);

      const displayedCities = useMemo(() => {
        return matchingCities
          .filter(city => 
            city.cityName.toLowerCase().includes(searchQuery.toLowerCase()) ||
            city.region.toLowerCase().includes(searchQuery.toLowerCase())
          )
          .sort((a, b) => {
            switch (sortBy) {
              case 'population-desc': return b.population - a.population;
              case 'population-asc': return a.population - b.population;
              case 'price-asc': return a.avg4BedHousePrice - b.avg4BedHousePrice;
              case 'price-desc': return b.avg4BedHousePrice - a.avg4BedHousePrice;
              case 'income-desc': return b.medianHouseholdIncome - a.medianHouseholdIncome;
              case 'minority-desc': return b.visibleMinorityPercentage - a.visibleMinorityPercentage;
              case 'costco-asc': return a.travelTimeToCostcoMinutes - b.travelTimeToCostcoMinutes;
              case 'metro-asc': return a.travelTimeToCityOver500kMinutes - b.travelTimeToCityOver500kMinutes;
              default: return 0;
            }
          });
      }, [matchingCities, searchQuery, sortBy]);

      // Initialize Map
      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current) return;

        const map = L.map(mapContainerRef.current, {
          center: [43.9, -79.8],
          zoom: 8,
          zoomControl: false
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
          maxZoom: 19
        }).addTo(map);

        mapInstanceRef.current = map;

        const timer = setTimeout(() => {
          map.invalidateSize();
        }, 150);

        const handleResize = () => {
          map.invalidateSize();
        };
        window.addEventListener('resize', handleResize);

        return () => {
          clearTimeout(timer);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      useEffect(() => {
        if (mapInstanceRef.current) {
          setTimeout(() => {
            mapInstanceRef.current.invalidateSize();
          }, 100);
        }
      }, [mobileTab]);

      // Render Leaflet Markers
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map || cities.length === 0) return;

        Object.values(markersRef.current).forEach(m => map.removeLayer(m));
        markersRef.current = {};

        cities.forEach(city => {
          const isMatch = matchingCityIds.has(city.id);
          const isSelected = selectedCity?.id === city.id;

          let iconHtml = isMatch
            ? `<div class="marker-pin-matching ${isSelected ? 'selected' : ''}"></div>`
            : `<div class="marker-pin-nonmatching"></div>`;

          const customIcon = L.divIcon({
            className: 'custom-div-icon',
            html: iconHtml,
            iconSize: isMatch ? [26, 26] : [12, 12],
            iconAnchor: isMatch ? [13, 26] : [6, 6],
            popupAnchor: [0, -26]
          });

          const marker = L.marker([city.coordinates.lat, city.coordinates.lng], { icon: customIcon })
            .addTo(map)
            .bindTooltip(`<div class="text-center font-semibold text-emerald-400">${city.cityName}<br/><span class="text-[10px] text-slate-300">Pop: ${city.population.toLocaleString()}</span></div>`, {
              direction: 'top',
              offset: [0, isMatch ? -26 : -8],
              className: 'custom-leaflet-tooltip'
            });

          const popupContent = `
            <div class="p-4 w-64 bg-slate-900 rounded-xl text-slate-100 font-sans">
              <div class="border-b border-slate-800 pb-2 mb-2.5 flex items-start justify-between">
                <div>
                  <h3 class="font-bold text-base text-emerald-400 font-outfit">${city.cityName}</h3>
                  <p class="text-xs text-slate-400">${city.region}</p>
                </div>
                ${isMatch ? '<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">Match</span>' : '<span class="bg-slate-800 text-slate-400 text-[10px] font-medium px-2 py-0.5 rounded-full">Filtered</span>'}
              </div>
              <div class="space-y-1.5 text-xs mb-3">
                <div class="flex justify-between bg-slate-950/60 p-1.5 rounded border border-slate-800">
                  <span class="text-slate-400">4-Bed House:</span>
                  <span class="font-bold text-emerald-300">$${city.avg4BedHousePrice.toLocaleString()}</span>
                </div>
                <div class="flex justify-between bg-slate-950/60 p-1.5 rounded border border-slate-800">
                  <span class="text-slate-400">Median Income:</span>
                  <span class="font-semibold text-slate-200">$${city.medianHouseholdIncome.toLocaleString()}</span>
                </div>
                <div class="flex justify-between bg-slate-950/60 p-1.5 rounded border border-slate-800">
                  <span class="text-slate-400">Population:</span>
                  <span class="font-semibold text-slate-200">${city.population.toLocaleString()}</span>
                </div>
                <div class="flex justify-between bg-slate-950/60 p-1.5 rounded border border-slate-800">
                  <span class="text-slate-400">Visible Minority:</span>
                  <span class="font-bold text-purple-300">${city.visibleMinorityPercentage}%</span>
                </div>
                <div class="grid grid-cols-2 gap-1 text-[10px] text-center pt-0.5">
                  <div class="bg-slate-950/60 p-1 rounded border border-slate-800">Costco: <strong class="text-amber-300">${city.travelTimeToCostcoMinutes}m</strong></div>
                  <div class="bg-slate-950/60 p-1 rounded border border-slate-800">Metro: <strong class="text-indigo-300">${city.travelTimeToCityOver500kMinutes}m</strong></div>
                </div>
              </div>
              <div class="flex gap-2">
                <button onclick="window.openDetailModal('${city.id}')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-1.5 px-2 rounded-lg text-xs transition-colors">Details</button>
                <a href="${city.wikipediaUrl}" target="_blank" rel="noopener noreferrer" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg text-xs border border-slate-700">Wiki ↗</a>
              </div>
            </div>
          `;

          // Disabling autoPan on popup so flyTo and popup opening happen simultaneously on the 1st click
          marker.bindPopup(popupContent, { autoPan: false });

          marker.on('click', () => {
            setSelectedCity(city);
            marker.openPopup();
          });

          markersRef.current[city.id] = marker;
        });
      }, [cities, matchingCityIds, selectedCity]);

      window.openDetailModal = (cityId) => {
        const target = cities.find(c => c.id === cityId);
        if (target) setDetailModalCity(target);
      };

      useEffect(() => {
        if (selectedCity && mapInstanceRef.current) {
          if (markersRef.current[selectedCity.id]) {
            markersRef.current[selectedCity.id].openPopup();
          }
          mapInstanceRef.current.flyTo(
            [selectedCity.coordinates.lat, selectedCity.coordinates.lng],
            10,
            { duration: 1.2 }
          );
        }
      }, [selectedCity]);

      const formatCurrency = (val) => val >= 2500000 ? '$2,500,000+' : '$' + (val / 1000).toFixed(0) + 'k';

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden bg-slate-950 text-slate-100 font-sans">
          {/* Header */}
          <header className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="h-9 w-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 p-0.5 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                <div className="h-full w-full bg-slate-950 rounded-[10px] flex items-center justify-center font-bold text-emerald-400">🏙️</div>
              </div>
              <div>
                <h1 className="text-lg font-bold text-white font-outfit tracking-tight">Ontario City Finder</h1>
                <p className="text-xs text-slate-400 hidden sm:block">Filter 120+ Southern Ontario towns, cities & communities (pop &gt;5k)</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="bg-slate-800/80 border border-slate-700/70 rounded-lg px-3 py-1 text-xs text-slate-300">
                Matching: <strong className="text-emerald-400">{matchingCities.length}</strong> / {cities.length} places
              </div>
              <div className="flex sm:hidden bg-slate-950 p-1 rounded-lg border border-slate-800">
                <button onClick={() => setMobileTab('filters')} className={`px-2.5 py-1 rounded text-xs ${mobileTab === 'filters' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}>Filters</button>
                <button onClick={() => setMobileTab('map')} className={`px-2.5 py-1 rounded text-xs ${mobileTab === 'map' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400'}`}>Map</button>
              </div>
            </div>
          </header>

          {/* Main Layout */}
          <main className="flex-1 flex overflow-hidden relative">
            {/* Sidebar */}
            <aside className={`w-full sm:w-[380px] lg:w-[420px] bg-slate-950 flex flex-col h-full border-r border-slate-800 z-20 ${mobileTab === 'filters' ? 'flex' : 'hidden sm:flex'}`}>
              <div className="p-3.5 border-b border-slate-800 bg-slate-900/60 flex items-center justify-between">
                <span className="font-bold text-slate-200 text-xs uppercase tracking-wider font-outfit">Filter Criteria</span>
                <button onClick={() => setFilters(DEFAULT_FILTERS)} className="text-xs font-semibold text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 px-2.5 py-1 rounded-lg transition-all">Reset All</button>
              </div>

              {/* Typed Input Controls */}
              <div className="p-4 space-y-3.5 border-b border-slate-800 bg-slate-900/30 overflow-y-auto max-h-[50vh]">
                {/* Population Min and Max Typed Number Inputs */}
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1.5">Population Range (Type values)</label>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <span className="text-[10px] text-slate-400 block mb-0.5">Min Population</span>
                      <input 
                        type="number"
                        placeholder="e.g. 5000"
                        value={filters.minPopulation}
                        onChange={e => setFilters(p => ({ ...p, minPopulation: e.target.value }))}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-cyan-300 font-bold focus:outline-none focus:border-emerald-500 transition-colors"
                      />
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400 block mb-0.5">Max Population</span>
                      <input 
                        type="number"
                        placeholder="e.g. 3000000"
                        value={filters.maxPopulation}
                        onChange={e => setFilters(p => ({ ...p, maxPopulation: e.target.value }))}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-cyan-400 font-bold focus:outline-none focus:border-emerald-500 transition-colors"
                      />
                    </div>
                  </div>
                </div>

                {/* Min Median Household Income Typed Number Input */}
                <div>
                  <label className="block text-xs font-medium text-slate-300 mb-1.5">Min Household Income ($ CAD)</label>
                  <div className="relative">
                    <span className="absolute left-2.5 top-1.5 text-xs text-teal-400 font-bold">$</span>
                    <input 
                      type="number"
                      placeholder="e.g. 50000"
                      value={filters.minIncome}
                      onChange={e => setFilters(p => ({ ...p, minIncome: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg pl-6 pr-3 py-1.5 text-xs text-teal-300 font-bold focus:outline-none focus:border-emerald-500 transition-colors"
                    />
                  </div>
                </div>

                {/* Max House Price Slider */}
                <div>
                  <div className="flex justify-between text-xs mb-1"><span className="text-slate-300">Max 4-Bed House Price</span><span className="font-bold text-emerald-400">{formatCurrency(filters.maxHousePrice)}</span></div>
                  <input type="range" min="400000" max="2500000" step="50000" value={filters.maxHousePrice} onChange={e => setFilters(p => ({...p, maxHousePrice: Number(e.target.value)}))} />
                </div>

                {/* Min Minority Slider */}
                <div>
                  <div className="flex justify-between text-xs mb-1"><span className="text-slate-300">Min Visible Minority %</span><span className="font-bold text-purple-300">{filters.minVisibleMinority}%</span></div>
                  <input type="range" min="0" max="100" step="5" value={filters.minVisibleMinority} onChange={e => setFilters(p => ({...p, minVisibleMinority: Number(e.target.value)}))} />
                </div>

                {/* Max Costco Time */}
                <div>
                  <div className="flex justify-between text-xs mb-1"><span className="text-slate-300">Max Costco Distance</span><span className="font-bold text-amber-300">{filters.maxCostcoTime >= 120 ? '120+ mins' : filters.maxCostcoTime + ' mins'}</span></div>
                  <input type="range" min="5" max="120" step="5" value={filters.maxCostcoTime} onChange={e => setFilters(p => ({...p, maxCostcoTime: Number(e.target.value)}))} />
                </div>

                {/* Max Metro Time */}
                <div>
                  <div className="flex justify-between text-xs mb-1"><span className="text-slate-300">Max Time to Metro (&gt;500k)</span><span className="font-bold text-indigo-300">{filters.maxMetroTime >= 180 ? '180+ mins' : filters.maxMetroTime + ' mins'}</span></div>
                  <input type="range" min="0" max="180" step="15" value={filters.maxMetroTime} onChange={e => setFilters(p => ({...p, maxMetroTime: Number(e.target.value)}))} />
                </div>
              </div>

              {/* Search & Sort Bar */}
              <div className="p-3 bg-slate-900/80 border-b border-slate-800 space-y-2">
                <div className="flex items-center justify-between text-xs">
                  <span className="font-semibold text-slate-300">Communities ({displayedCities.length})</span>
                  <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-slate-950 text-slate-300 border border-slate-800 rounded px-2 py-1 text-xs">
                    <option value="population-desc">Pop: High → Low</option>
                    <option value="population-asc">Pop: Low → High</option>
                    <option value="price-asc">Price: Low → High</option>
                    <option value="price-desc">Price: High → Low</option>
                    <option value="income-desc">Income: High → Low</option>
                    <option value="minority-desc">Minority %: High → Low</option>
                  </select>
                </div>
                <input type="text" placeholder="Search town, city or region..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500" />
              </div>

              {/* City Cards List */}
              <div className="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-950/50">
                {displayedCities.map(city => {
                  const isSel = selectedCity?.id === city.id;
                  return (
                    <div key={city.id} onClick={() => { setSelectedCity(city); if(window.innerWidth < 640) setMobileTab('map'); }} className={`p-3 rounded-xl border cursor-pointer transition-all ${isSel ? 'bg-emerald-950/40 border-emerald-500/80 ring-1 ring-emerald-500/40' : 'bg-slate-900/70 hover:bg-slate-800/80 border-slate-800'}`}>
                      <div className="flex justify-between items-start mb-1.5">
                        <div>
                          <h3 className="font-bold text-slate-100 text-sm">{city.cityName}</h3>
                          <p className="text-[11px] text-slate-400">{city.region}</p>
                        </div>
                        <button onClick={(e) => { e.stopPropagation(); setDetailModalCity(city); }} className="text-xs text-emerald-400 hover:underline">Details ↗</button>
                      </div>

                      <div className="grid grid-cols-2 gap-1.5 text-xs">
                        <div className="bg-slate-950/60 p-1.5 rounded border border-slate-800/80">
                          <span className="text-slate-400 block text-[10px]">House Price</span>
                          <span className="font-bold text-emerald-400">${city.avg4BedHousePrice.toLocaleString()}</span>
                        </div>
                        <div className="bg-slate-950/60 p-1.5 rounded border border-slate-800/80">
                          <span className="text-slate-400 block text-[10px]">Median Income</span>
                          <span className="font-bold text-teal-300">${city.medianHouseholdIncome.toLocaleString()}</span>
                        </div>
                        <div className="bg-slate-950/60 p-1.5 rounded border border-slate-800/80">
                          <span className="text-slate-400 block text-[10px]">Population</span>
                          <span className="font-semibold text-slate-200">${city.population.toLocaleString()} (${city.visibleMinorityPercentage}% min)</span>
                        </div>
                        <div className="bg-slate-950/60 p-1.5 rounded border border-slate-800/80">
                          <span className="text-slate-400 block text-[10px]">Costco Distance</span>
                          <span className="font-semibold text-amber-300">${city.travelTimeToCostcoMinutes} mins</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </aside>

            {/* Map Container */}
            <div className={`flex-1 h-full relative ${mobileTab === 'map' ? 'block' : 'hidden sm:block'}`}>
              <div ref={mapContainerRef} className="w-full h-full"></div>
            </div>
          </main>

          {/* Modal */}
          {detailModalCity && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                  <div>
                    <span className="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">{detailModalCity.region}</span>
                    <h2 className="text-2xl font-bold text-white font-outfit mt-1">{detailModalCity.cityName}</h2>
                  </div>
                  <button onClick={() => setDetailModalCity(null)} className="text-slate-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-slate-400 block">4-Bed House Price</span>
                    <span className="text-base font-bold text-emerald-400">${detailModalCity.avg4BedHousePrice.toLocaleString()}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-slate-400 block">Median Household Income</span>
                    <span className="text-base font-bold text-teal-300">${detailModalCity.medianHouseholdIncome.toLocaleString()}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-slate-400 block">Population</span>
                    <span className="text-base font-bold text-slate-100">${detailModalCity.population.toLocaleString()}</span>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-slate-400 block">Visible Minority %</span>
                    <span className="text-base font-bold text-purple-300">${detailModalCity.visibleMinorityPercentage}%</span>
                  </div>
                </div>

                <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-xs space-y-2">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Nearest Costco:</span>
                    <span className="font-semibold text-amber-300">${detailModalCity.travelTimeToCostcoMinutes} mins</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Nearest Metro (&gt;500k):</span>
                    <span className="font-semibold text-indigo-300">${detailModalCity.nearestCityOver500k} (${detailModalCity.travelTimeToCityOver500kMinutes} mins)</span>
                  </div>
                </div>

                <div className="flex justify-between items-center pt-2">
                  <button onClick={() => setDetailModalCity(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold">Close</button>
                  <a href={detailModalCity.wikipediaUrl} target="_blank" rel="noopener noreferrer" className="px-4 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-emerald-500/20">Read on Wikipedia ↗</a>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
